name: Math engine tests

on:
  push:
    branches-ignore: ["ci-logs", "ci-test-logs"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        working-directory: Packages/MathEngine
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../test.log

      # Publish the log to a branch so it can be read with plain git.
      - name: Publish test log
        if: always()
        run: |
          touch test.log
          grep -nE "error:|failed|passed|Executed|XCTAssert" test.log | head -400 > test-summary.txt || true
          mkdir -p /tmp/tlogs && cp test.log test-summary.txt /tmp/tlogs/
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/tlogs/status.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-test-logs
          git rm -rfq . || true
          cp /tmp/tlogs/* .
          git add test.log test-summary.txt status.txt
          git commit -qm "Test log for ${{ github.sha }}"
          git push -f origin ci-test-logs
