name: Build iPhone app

on:
  push:
    branches-ignore: ["ci-logs", "ci-test-logs"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MathAlarm.xcodeproj \
            -scheme MathAlarm \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MathAlarm.app Payload/
          zip -qry MathAlarm.ipa Payload
          ls -la MathAlarm.ipa
          # Fingerprint so the downloaded file can be checked against what was built.
          shasum -a 256 MathAlarm.ipa | tee ipa-sha256.txt
          echo "### MathAlarm.ipa SHA-256: \`$(cut -d' ' -f1 ipa-sha256.txt)\`" >> "$GITHUB_STEP_SUMMARY"

      # Public download link (also lets VirusTotal scan it by URL before downloading).
      - name: Publish the release for this branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prototype' || github.ref == 'refs/heads/original'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            main) TAG=latest; TITLE="Latest build" ;;
            prototype) TAG=prototype; TITLE="Prototype (Math Alarm β)" ;;
            original) TAG=original-v1; TITLE="Original v1 (before the prototype)" ;;
          esac
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" MathAlarm.ipa ipa-sha256.txt \
            --title "$TITLE" \
            --notes "Built from commit ${{ github.sha }} (branch ${GITHUB_REF_NAME}). SHA-256: $(cut -d' ' -f1 ipa-sha256.txt)" \
            --target "${{ github.sha }}"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MathAlarm-ipa
          path: MathAlarm.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Also publish the log to the ci-logs branch so it can be read with plain git.
      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          touch build.log
          grep -nE "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\* " build.log | head -300 > summary.txt || true
          tail -150 build.log > tail.txt
          mkdir -p /tmp/logs && cp build.log summary.txt tail.txt /tmp/logs/
          cp ipa-sha256.txt /tmp/logs/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/logs/status.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/logs/* .
          git add build.log summary.txt tail.txt status.txt $(ls ipa-sha256.txt 2>/dev/null)
          git commit -qm "Build log for ${{ github.sha }}"
          git push -f origin ci-logs
